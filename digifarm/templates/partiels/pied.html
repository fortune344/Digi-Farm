{% load icone %}

    <p class="flex items-center gap-2">
      {% icone "sprout" classe="size-4 text-primary" %}
      Digi-Farm — la marketplace agricole du Togo
    </p>
    <p class="flex items-center gap-1.5">
      {% icone "shield-check" classe="size-4 text-primary" %}
      Paiement séquestré jusqu'à réception
    </p>
  </div>
</footer>
