{% load icone %}
<header class="sticky top-0 z-40 border-b border-border/60 bg-background/80 backdrop-blur-xl">
  <div class="mx-auto flex h-16 max-w-6xl items-center justify-between gap-4 px-4">
    <a href="{% url 'annonces:accueil' %}" class="inline-flex items-center gap-2 font-semibold">
      <span class="flex size-8 items-center justify-center rounded-lg bg-primary text-primary-foreground">
        {% icone "sprout" classe="size-5" %}
      </span>
      <span class="text-lg tracking-tight">Digi-Farm</span>
    </a>

    <nav class="flex items-center gap-1 sm:gap-2" aria-label="Navigation principale">
      <a href="{% url 'annonces:marche' %}" class="bouton fantome petit">
        {% icone "store" %}<span class="hidden sm:inline">Marché</span>
      </a>

      {% if user.is_authenticated %}
        <a href="{% url 'comptes:tableau_de_bord' %}" class="bouton fantome petit">
          {% icone "layout-dashboard" %}<span class="hidden sm:inline">Tableau de bord</span>
        </a>
        <a href="{% url 'comptes:profil' %}" class="bouton fantome petit" title="Mon profil">
          {% icone "user-round" %}<span class="sr-only">Mon profil</span>
        </a>
        <form method="post" action="{% url 'comptes:deconnexion' %}">
          {% csrf_token %}
          <button type="submit" class="bouton fantome petit" title="Se déconnecter">
            {% icone "log-out" %}<span class="sr-only">Se déconnecter</span>
          </button>
        </form>
      {% else %}
        <a href="{% url 'comptes:connexion' %}" class="bouton fantome petit">Connexion</a>
        <a href="{% url 'comptes:inscription' %}" class="bouton primaire petit">
          <span class="hidden sm:inline">Créer un compte</span><span class="sm:hidden">S'inscrire</span>
        </a>
      {% endif %}
    </nav>
  </div>
</header>
